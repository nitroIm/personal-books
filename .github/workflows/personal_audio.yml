# ============================================================
# ARGUS - PERSONAL AUDIO (PDF -> TEXT -> RU -> MP3 -> TG)
# ------------------------------------------------------------
# v2: мультиязычный перевод (NLLB-200).
#     - принимает book через dispatch
#     - ffmpeg для concat mp3
#     - кэш _RU.txt коммитится обратно
# v1: базовый PDF -> MP3
# ============================================================

name: Personal Audio

on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Имя книги (без .pdf)'
        required: true
      prefer:
        description: 'ru или en'
        required: false
        default: 'ru'
  repository_dispatch:
    types: [personal_audio]

permissions:
  contents: write

concurrency:
  group: argus-personal-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install requests==2.32.3
          pip install gTTS
          pip install PyPDF2
          pip install langdetect
          pip install transformers==4.41.2
          pip install sentencepiece
          pip install torch==2.2.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Run audio
        env:
          BOOK: >-
            ${{ github.event.client_payload.book
             || github.event.inputs.book }}
          PREFER: >-
            ${{ github.event.client_payload.prefer
             || github.event.inputs.prefer
             || 'ru' }}
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: |
          cd scripts
          if [ "${PREFER}" = "en" ]; then
            python personal_audio.py "${BOOK}" --en
          else
            python personal_audio.py "${BOOK}"
          fi

      - name: Commit RU cache
        if: always()
        run: |
          git config user.name "ARGUS"
          git config user.email "argus@github.com"
          git add personal_books/*_RU.txt || true
          git add data/translation_cache.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ARGUS: audio cache [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Push OK"
              break
            fi
            echo "Retry $i"
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \
                 \"text\": \"Personal Audio упал\", \
                 \"parse_mode\": \"HTML\"}" || true