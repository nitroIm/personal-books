# ============================================================
# Personal Books - FIND
# ------------------------------------------------------------
# v2: NLLB перевод карточек (любой язык -> RU).
#     - CPU torch
#     - langdetect для детекта языка
#     - кэш HF моделей
# v1: базовый поиск + отправка карточек
# ============================================================

name: Personal Find

on:
  repository_dispatch:
    types: [personal_find]
  workflow_dispatch:
    inputs:
      topic:
        description: 'Тема поиска'
        required: true

permissions:
  contents: write

concurrency:
  group: personal-find
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nllb-find-v1
          restore-keys: hf-nllb-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.0 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.41.2
          pip install sentencepiece==0.2.0
          pip install sacremoses==0.1.1
          pip install tokenizers==0.19.1
          pip install numpy==1.26.4
          pip install requests==2.32.3
          pip install langdetect==1.0.9

      - name: Run personal finder
        env:
          TOPIC: >-
            ${{ github.event.client_payload.topic
             || github.event.inputs.topic }}
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Topic: $TOPIC"
          python scripts/personal_finder.py "$TOPIC"

      - name: Commit candidates
        run: |
          git config user.name "Personal Books"
          git config user.email "personal@github.com"
          git add data/personal_candidates.json || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "personal: find [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Push OK"
              break
            fi
            echo "Retry $i"
            sleep 5
          done

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: >-
            ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: >-
            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \
                 \"text\": \"Personal Find упал\", \
                 \"parse_mode\": \"HTML\"}" || true